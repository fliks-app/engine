# release-please opens the release PR; once it merges, the same run builds and attaches
# binaries, sha256 files, and openapi.json to the release; hosts generate their own client types from it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build assets for (e.g. v0.1.0)'
        required: true
      dry_run:
        description: 'Build only, attach nothing (tests the build and warms the cache)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rp.outputs.tag_name || inputs.tag }}
    steps:
      - id: rp
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT lets the release PR trigger CI; GITHUB_TOKEN-created PRs never do.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { name: darwin-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Add the target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@0e2bf4f9b6d26ffa61b50f640b26684368f2056e # cross
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.cross }}" ]; then B="cross"; else B="cargo"; fi
          $B build --release -p fliks-engine --bin fliks-engine --target ${{ matrix.target }}
      - name: Stage the binary and its checksum
        shell: bash
        run: |
          mkdir out
          cp "target/${{ matrix.target }}/release/fliks-engine${{ matrix.ext }}" "out/fliks-engine-${{ matrix.name }}${{ matrix.ext }}"
          cd out
          if command -v sha256sum >/dev/null; then sha256sum "fliks-engine-${{ matrix.name }}${{ matrix.ext }}" > "fliks-engine-${{ matrix.name }}${{ matrix.ext }}.sha256"
          else shasum -a 256 "fliks-engine-${{ matrix.name }}${{ matrix.ext }}" > "fliks-engine-${{ matrix.name }}${{ matrix.ext }}.sha256"; fi
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: out/fliks-engine-${{ matrix.name }}${{ matrix.ext }}
      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" out/* --clobber --repo "$GITHUB_REPOSITORY"

  contract:
    needs: release-please
    if: needs.release-please.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Attach openapi.json
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" openapi.json --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: [release-please, build]
    if: needs.release-please.outputs.tag != '' && !inputs.dry_run
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Publish SHA256SUMS
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'fliks-engine-*.sha256'
          cat fliks-engine-*.sha256 > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

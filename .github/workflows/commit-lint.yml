# Conventional commits on every PR commit and on main (same defaults as fliks).
name: Lint commit messages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    # Dependabot bodies carry release notes; the squash message is linted on push.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

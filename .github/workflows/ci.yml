name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/**'
      - 'fixtures/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'openapi.json'
      - '.github/oasdiff-levels.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Regenerate openapi.json
        run: cargo run -q --bin gen-openapi > openapi.json
      - name: Drift check
        run: git diff --exit-code -- openapi.json
      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/main:openapi.json 2>/dev/null; then
            git show origin/main:openapi.json > /tmp/base.json
            docker run --rm -v /tmp/base.json:/base.json -v "$PWD/openapi.json:/new.json" \
              -v "$PWD/.github/oasdiff-levels.txt:/levels.txt" \
              tufin/oasdiff breaking /base.json /new.json --fail-on ERR --severity-levels /levels.txt
          else
            echo "no openapi.json on main yet, skipping"
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/**'
      - 'fixtures/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'openapi.json'
      - '.github/oasdiff-levels.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Regenerate openapi.json
        run: cargo run -q --bin gen-openapi > openapi.json
      - name: Drift check
        run: git diff --exit-code -- openapi.json
      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/main:openapi.json 2>/dev/null; then
            git show origin/main:openapi.json > /tmp/base.json
            docker run --rm -v /tmp/base.json:/base.json -v "$PWD/openapi.json:/new.json" \
              -v "$PWD/.github/oasdiff-levels.txt:/levels.txt" \
              tufin/oasdiff breaking /base.json /new.json --fail-on ERR --severity-levels /levels.txt
          else
            echo "no openapi.json on main yet, skipping"
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  e2e:
    # The engine image's jellyfin-ffmpeg build (noble); the subtitle timestamps depend on the ffmpeg version.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JELLYFIN_FFMPEG_VERSION: 8.1.2-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install jellyfin-ffmpeg and chromaprint
        run: |
          wget -q -O /tmp/jf.deb "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${JELLYFIN_FFMPEG_VERSION}/jellyfin-ffmpeg8_${JELLYFIN_FFMPEG_VERSION}-noble_amd64.deb"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/jf.deb libchromaprint-tools
      - name: Real-ffmpeg tests (CPU only)
        env:
          ENGINE_E2E: '1'
        run: |
          FFMPEG_PATH=/usr/lib/jellyfin-ffmpeg/ffmpeg FFPROBE_PATH=/usr/lib/jellyfin-ffmpeg/ffprobe FPCALC_PATH=$(command -v fpcalc) \
            cargo test -p fliks-engine --no-fail-fast --test runtime_e2e --test live_e2e --test runtime_sync

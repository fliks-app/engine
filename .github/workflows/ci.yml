name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate openapi.json
        run: cargo run -q --bin gen-openapi > openapi.json
      - name: Drift check
        run: git diff --exit-code -- openapi.json
      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/main:openapi.json 2>/dev/null; then
            git show origin/main:openapi.json > /tmp/base.json
            docker run --rm -v /tmp/base.json:/base.json -v "$PWD/openapi.json:/new.json" \
              -v "$PWD/.github/oasdiff-levels.txt:/levels.txt" \
              tufin/oasdiff breaking /base.json /new.json --fail-on ERR --severity-levels /levels.txt
          else
            echo "no openapi.json on main yet, skipping"
          fi

[workspace]
resolver = "3"
members = ["crates/core", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fliks-app/engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5"

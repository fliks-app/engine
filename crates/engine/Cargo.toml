[package]
name = "fliks-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fliks video engine: control plane, supervisor"
default-run = "fliks-engine"

[lib]
name = "fliks_engine"

[[bin]]
name = "fliks-engine"
path = "src/main.rs"

[dependencies]
fliks-engine-core = { path = "../core" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "io-util", "fs"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
utoipa.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = "0.3"

[package]
name = "fliks-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fliks video engine: control plane, supervisor"
default-run = "fliks-engine"

[lib]
name = "fliks_engine"

[[bin]]
name = "fliks-engine"
path = "src/main.rs"

[dependencies]
fliks-engine-core = { path = "../core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "io-util", "fs"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
utoipa.workspace = true
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
alass-core = "2"
webrtc-vad = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1"
